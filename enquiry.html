    <meta property="og:url" content="https://www.thedailycafe.co.za/enquiry.html">

</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
        <div class="masthead">
            <img class="logo" src="IMAGES/logo.png" width="56" height="56" alt="The Daily Cafe logo">
            <div class="masthead-text">
                <span class="masthead-title">The Daily Cafe</span>
                <span class="masthead-tagline">A cozy cafe in town</span>
            </div>
        </div>
        <button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
            <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Main">
            <a href="home.html">Home</a>
            <a href="about-us.html">About us</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact-us.html">Contact us</a>
            <a href="enquiry.html" aria-current="page">Enquiry</a>
        </nav>
    </header>

    <main id="main">
        <div class="page-intro">
            <h1>Send us an enquiry</h1>
            <p>Got a question about catering, bookings, or anything else? Choose "Catering / bookings" for an instant cost estimate and availability check.</p>
        </div>

        <form class="enquiry-form" id="enquiry-form" novalidate>
            <div class="form-group">
                <label for="enquiry-name">Full name <span class="required">*</span></label>
                <input type="text" id="enquiry-name" name="name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="enquiry-email">Email address <span class="required">*</span></label>
                <input type="email" id="enquiry-email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="enquiry-phone">Phone number</label>
                <input type="tel" id="enquiry-phone" name="phone" autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="enquiry-type">Enquiry type</label>
                <select id="enquiry-type" name="type">
                    <option value="general">General enquiry</option>
                    <option value="catering">Catering / bookings</option>
                    <option value="feedback">Feedback</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="enquiry-message">Message <span class="required">*</span></label>
                <textarea id="enquiry-message" name="message" required></textarea>
            </div>

            <div id="catering-fields" hidden>
                <div class="form-group"><label for="enquiry-guests">Number of guests <span class="required">*</span></label><input type="number" id="enquiry-guests" name="guests" min="10" max="200" inputmode="numeric"></div>
                <div class="form-group"><label for="enquiry-date">Event date <span class="required">*</span></label><input type="date" id="enquiry-date" name="date"></div>
            </div>

            <button type="submit" class="btn-submit">Send enquiry</button>

            <div class="form-success" id="enquiry-success" tabindex="-1" role="status"></div>
        </form>
    </main>

    <footer class="site-footer">&copy; ST10527760 &middot; The Daily Cafe
                <p class="site-footer" id="datetime"></p>

    </footer>
    <script src="JAVA SCRIPT/main.js" defer></script>
</body>
</html>
